name: solamnia-portal

# The image is built by CI (.github/workflows/docker.yml) and pulled from GHCR, so
# the host needs no source checkout and no build toolchain: the Dockge stack dir
# holds only this file plus .env, the same shape as every other stack on the box.
#   Deploy:   docker compose pull && docker compose up -d
#   Rollback: pin the previous immutable tag on both services
#             (ghcr.io/sturmb/solamnia-portal:sha-<short-sha>, listed on the
#             GHCR package page), then pull && up -d again.
#   Sync:     this repo is canonical for this file — edit it here, never in
#             Dockge's UI, or the two copies diverge with no history. Pull it onto
#             the host with:
#             curl -O https://raw.githubusercontent.com/SturmB/solamnia-portal/main/compose.yaml
# No `docker login ghcr.io` needed: the package inherited this repo's public
# visibility, so the host pulls anonymously. If the repo is ever made private the
# package follows, and the host then needs one `docker login ghcr.io` with a
# classic PAT scoped to read:packages only.

services:
    # Web app: php-fpm + nginx, reached only through the Cloudflare Tunnel.
    app:
        image: ghcr.io/sturmb/solamnia-portal:latest
        restart: unless-stopped
        env_file: .env
        environment:
            # serversideup Laravel automations, on every boot: migrate --force,
            # storage:link, and config/route/view cache (re-caches after .env edits).
            AUTORUN_ENABLED: "true"
            # Belt-and-suspenders for the MJML renderer's `node` lookup.
            MJML_NODE_PATH: /usr/local/bin
        # No published host port — the portal is reachable only through the Cloudflare
        # Tunnel, which resolves the `portal` alias on the shared `solamnia` network.
        networks:
            default: {}
            solamnia:
                aliases:
                    - portal
        volumes:
            - storage-public:/var/www/html/storage/app/public
        depends_on:
            mysql:
                condition: service_healthy

    # The send mechanism: a foreground scheduler loop that runs schedule:run every
    # minute (drives campaigns:send-due). Overriding entrypoint skips the web
    # server and the migrate-on-boot automation, so only `app` ever migrates.
    scheduler:
        # Same pulled image as `app`, just a different entrypoint.
        image: ghcr.io/sturmb/solamnia-portal:latest
        restart: unless-stopped
        env_file: .env
        environment:
            MJML_NODE_PATH: /usr/local/bin
        entrypoint: ["php", "artisan", "schedule:work"]
        # This container runs only the scheduler loop — no web server — so the base
        # image's HTTP healthcheck (curls localhost:8080/up) can never pass. Disable it
        # to avoid a permanent false "unhealthy". `restart: unless-stopped` still covers crashes.
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_started
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        # Bound to the host loopback only — reachable on the box itself and via an
        # SSH tunnel (e.g. a DB client's SSH-tunnel feature), never advertised to the
        # LAN. The app still talks to it over the Docker network as host `mysql`.
        # Host port 3307 (not 3306): another stack's `mariadb` already owns 3306 on
        # the host. Inside the container MySQL still listens on 3306.
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 10s
            timeout: 5s
            retries: 12

volumes:
    db-data:
    storage-public:

networks:
    # Pre-existing external network shared with the cloudflared stack, so the tunnel
    # reaches this app by the `portal` alias with no published host port.
    solamnia:
        external: true
        name: solamnia
